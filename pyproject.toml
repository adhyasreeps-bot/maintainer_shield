[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-shield"
version = "0.1.0"
description = "Open-source PR triage assistant for maintainers"
readme = "README.md"
authors = [{ name = "Maintainer Shield Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
